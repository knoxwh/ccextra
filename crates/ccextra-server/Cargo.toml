[package]
name = "ccextra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ccextra-core.workspace = true

serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream = "0.3"
bytes.workspace = true
zstd.workspace = true
anyhow.workspace = true
tracing.workspace = true
globset.workspace = true
bcrypt.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
lru = "0.18"
md-5 = "0.11"
wreq = { version = "0.16.1", default-features = true, features = ["json", "stream", "socks", "gzip", "brotli", "deflate", "zstd"] }

time = { version = "0.3", features = ["formatting", "parsing", "std"] }
getrandom = "0.4"
fslock = "0.2"
regex = "1"
# 入站 body 超限识别(LengthLimitError → 413)
http-body-util = "0.1"
# antigravity.gohttp:经 Unix socket 向 ccextra-gohttp 发绝对形 HTTP/1.1(均已随 reqwest 入锁)
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"

[dev-dependencies]
tower.workspace = true
tempfile = "3"
yaml_serde = "0.10"
# start_paused 测试时钟(limits 停顿用例)
tokio = { version = "1.35", features = ["test-util"] }
# 坏凭证告警用例:捕获 tracing 输出
tracing-subscriber.workspace = true
# gohttp 真二进制 gzip SSE e2e:本地 TLS 上游 + gzip 编码(均已在锁内)
tokio-rustls = "0.26"
flate2 = "1"
