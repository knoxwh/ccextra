[package]
name = "ccextra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ccextra-core.workspace = true

serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
async-stream = "0.3"
bytes.workspace = true
zstd.workspace = true
anyhow.workspace = true
tracing.workspace = true
globset.workspace = true
bcrypt.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
lru.workspace = true
md-5.workspace = true
# 精确锁定:升级 wreq 会改变 Claude TLS 指纹(JA3/JA4);管不到传递依赖 btls/tokio-btls,勿整体 cargo update
# 任何依赖更新后必跑 scripts/check_fingerprints.sh
wreq = { version = "=0.16.3", default-features = true, features = ["json", "stream", "socks", "gzip", "brotli", "deflate", "zstd"] }

time = { workspace = true, features = ["formatting", "parsing", "std"] }
getrandom = "0.4"
fslock = "0.2"
regex.workspace = true
# 入站 body 超限识别(LengthLimitError → 413)
http-body-util = "0.1"

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true
yaml_serde.workspace = true
# start_paused 测试时钟(limits 停顿用例)
tokio = { workspace = true, features = ["test-util"] }
# 坏凭证告警用例:捕获 tracing 输出
tracing-subscriber.workspace = true
# anthropic_official 测试:构造 gzip 响应体验证原样透传
flate2 = "1"
