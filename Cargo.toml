[workspace]
members = [
    "crates/ccextra-core",
    "crates/ccextra-server",
    "crates/ccextra-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
authors = ["wanghao"]
license = "MIT"
repository = "https://github.com/knoxwh/ccextra"

[workspace.dependencies]
# Workspace crates
ccextra-core = { path = "crates/ccextra-core" }
ccextra-server = { path = "crates/ccextra-server" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
serde_yaml = "0.9"

# HTTP server
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.35", features = ["full"] }
tower = { version = "0.5", features = ["util"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "socks", "http2"] }

# Async
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
bytes = "1.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }

# Crypto (for session key derivation)
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Secret key hashing (明文自动转 bcrypt)
bcrypt = "0.15"

# Pattern matching (for payload model wildcards)
globset = "0.4"

# Local token estimation (count_tokens, O200k tokenizer)
tiktoken-rs = "0.11"

# CLI
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3          # 最大运行时优化
lto = "thin"           # 分区链接时优化，链接阶段可并行，编译明显更快
strip = true           # 裁掉符号表
panic = "abort"        # 去掉 unwinding 代码，减体积 + 轻微提速
