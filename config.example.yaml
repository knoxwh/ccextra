# ccextra 配置示例

server:
  host: "127.0.0.1"
  port: 8222
  # 可选；全局代理兜底，"direct" 表示不走代理
  proxy_url: "http://127.0.0.1:7897"

# User-Agent 自定义(可选)。以下为默认值。
user_agents:
  claude_cli: "claude-cli/2.1.258"
  codex_tui: "codex_cli_rs/0.153.3 (Mac OS 26.6.2; arm64)"
  grok_version: "1.0.46"
  antigravity: "antigravity/hub/2.10.0 darwin/arm64"

# 入口 secret key(可选)。配置后 /v1/messages、/v1/messages/count_tokens 与
# /v1/models 需 x-api-key 匹配;/health 与 /reload 不认证。
# Claude Code 用 ANTHROPIC_AUTH_TOKEN 或环境变量注入该 key。
secret_key: "sk-ccextra-xxx"

# Antigravity 凭证目录(可选)。默认配置文件旁 .cache/antigravity。
# auth_dir: ".cache/antigravity"

# xAI Grok 凭证目录(可选)。默认配置文件旁 .cache/xai。
# xai_auth_dir: ".cache/xai"

# Codex 凭证目录(可选)。默认配置文件旁 .cache/codex。
# codex_auth_dir: ".cache/codex"

# Claude 订阅 (Anthropic OAuth) 凭证目录(可选)。默认配置文件旁 .cache/claude。
# 登录: ./ccextra claude-login → 启动时自动扫描并注入 protocol: claude provider
# (base_url=https://api.anthropic.com, key=access_token)。与静态 API/中转共用直通管线。
# claude_auth_dir: ".cache/claude"

# 凡 config protocol: claude 出站默认走 Bun TLS 指纹车道(wreq/BoringSSL,
# 对齐 Claude Code / Bun peet JA3/JA4 + HTTP/1.1;官方与第三方 Claude 兼容站均适用)。
# 验收: cargo run -p ccextra-server --example peet_fp
# 说明: crates/ccextra-server/src/claude_tls_fp/STATUS.md


# Antigravity 模型白名单(可选)。glob 或精确名;缺省/空 = 全量发布。
# antigravity_models:
#   - "gemini-3.8-flash-*"

# reasoning 级别注册表(可选)。相对配置文件解析,默认同目录 models.json。
# 缺文件 = 不钳制 effort;/reload 会重读。示例见仓库根 models.json。
# models_file: "models.json"

# Antigravity 连接池(可选)。默认短连接:空闲连接响应结束即关闭,
# 防止凭证轮换下 socket 堆积与陈旧连接错误;仅显式 enabled: true 才保留池。
# antigravity:
#   connection-pool:
#     enabled: false             # 是否启用连接池(默认 false = 短连接)
#     idle-conn-timeout: "30s"   # 空闲连接存活时长(默认 30s,上限 210s)
#     max-idle-conns-per-host: 2 # 每凭证每 host 最大空闲连接数(默认 2,上限 100)

# Provider 定义
providers:
  - name: xxx1
    protocol: claude
    base_url: https://xxx
    key: sk-ant-xxx
    # 可选；覆盖全局代理，"direct" 表示不走代理
    proxy_url: "direct"
    models:
      - name: claude-opus-5
        alias: claude-opus-5
        max_input_tokens: 200000
        max_tokens: 64000
      - name: claude-sonnet-5
        alias: claude-sonnet-5
      - name: claude-fable-5
        alias: claude-fable-5

  - name: xxx2
    protocol: openai_chat
    base_url: https://xxx
    key: sk-xxx
    models:
      - name: glm-5.1
        alias: glm-5.1

  - name: xxx-codex
    protocol: openai_responses
    base_url: https://xxx
    key: sk-xxx
    # 注入派生 prompt_cache_key(provider 级开关,默认 false)
    # key = 会话 ID 裸值(对齐 codex 0.147),确定性桶;仅 openai_chat/openai_responses 生效
    # grok chat 不注入(粘性走 x-grok-conv-id);已有非空 key 不剥(转换后写回)。grok responses 开关开仍注入
    # grok 判定看 payload 后出站 model
    prompt_cache_key: true
    models:
      - name: gpt-5.6-terra
        alias: gpt-5.6-terra

  # Cloud Code Assist(OAuth)。无需手配:启动时自动扫描上方 auth_dir,
  # 为每份有效凭证注入一个 antigravity provider(模型列表自动拉取)。
  # 凭证获取: ./ccextra antigravity-login → 写入 .cache/antigravity
  # 也可显式声明(多 base_url 按序回退:网络/读错、429 切下一个):
  # - name: antigravity
  #   protocol: antigravity
  #   base_url:
  #     - "https://daily-cloudcode-pa.googleapis.com"
  #     - "https://cloudcode-pa.googleapis.com"
  #   key: ""
  #   models:
  #     - name: gemini-3.7-flash-high
  #       alias: gemini-3.7-flash-high

  # xAI Grok (OAuth)。无需手配:启动时自动扫描上方 xai_auth_dir,
  # 为每份有效凭证注入一个 xai provider(OpenAI Responses 协议)。
  # 凭证获取: ./ccextra xai-login → 写入 .cache/xai

# Payload 参数覆盖(按模型名模式匹配;protocol 限定生效目标协议)
# openai_chat 出站会在 payload 后再守卫:kimi 非法 temperature 剥掉;
# tool_stream 仅保留 qwen/glm(百炼文档);gpt-5/o 等把 max_tokens 迁为 max_completion_tokens。
payload:
  - models:
      - "*glm*"
      - "*kimi*"
      - "*qwen*"
    params:
      max_tokens: 32000
      temperature: 0.1

  # tool_stream:百炼可选字段(默认 false,仅 stream=true);文档支持 Qwen/GLM,勿打到 kimi/doubao
  # clear_thinking 仍偏智谱 Chat
  - models:
      - "*glm*"
      - "*GLM*"
      - "*qwen*"
      - "*Qwen*"
    protocol: openai_chat
    params:
      tool_stream: true

  - models:
      - "*glm*"
      - "*GLM*"
    protocol: openai_chat
    params:
      clear_thinking: false

  - models:
      - "*gpt*"
    protocol: openai_chat
    params:
      temperature: 0.1

# 缓存归一化
normalize:
  enabled: true
  drift_detector: true

# 日志
logging:
  level: info
  request_body: false
