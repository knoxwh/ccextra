# ccextra 配置示例

server:
  host: "127.0.0.1"
  port: 8222

# Provider 定义
providers:
  - name: evol-claude
    protocol: claude
    base_url: https://mg-new.evolai.cn/claude-proxy
    key: sk-ant-xxx
    models:
      - name: claude-opus-5
        alias: evol-opus-5
      - name: claude-sonnet-5
        alias: evol-sonnet-5
      - name: claude-fable-5
        alias: evol-fable-5

  - name: saic
    protocol: openai_chat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    key: sk-xxx
    models:
      - name: glm-5.1-27717e1a8a72-glm51
        alias: glm-5.1

  - name: ckff-codex
    protocol: openai_responses
    base_url: https://ckff.dev/v1
    key: sk-xxx
    models:
      - name: gpt-5.6-terra
        alias: ck-gpt-5.6-terra

# Payload 参数覆盖(按模型名模式匹配)
payload:
  - models:
      - "*glm*"
      - "*kimi*"
      - "*qwen*"
    params:
      max_tokens: 32000
      temperature: 0.1

  - models:
      - "*gpt*"
    params:
      temperature: 0.1

# 缓存归一化
normalize:
  enabled: true
  drift_detector: true

# 日志
logging:
  level: info
  request_body: false
