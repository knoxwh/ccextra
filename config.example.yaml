# ccextra 配置示例

server:
  host: "127.0.0.1"
  port: 8222
  # 全局代理兜底；provider 未配置时必填。"direct"/"none" 直连，支持 http/https/socks5h（socks5 改写为 socks5h），缺失/空值/非法值报错
  proxy_url: "http://127.0.0.1:7897"

# User-Agent 自定义(可选)。以下为默认值。
user_agents:
  claude_cli: "claude-cli/2.1.258"
  codex_tui: "codex_cli_rs/0.153.3 (Mac OS 26.6.2; arm64)"
  grok_version: "1.0.46"
  antigravity: "antigravity/hub/2.31.2 (aidev_client; os_type=darwin; arch=arm64)"

# 入口 secret key(可选)。配置后 /v1/messages、/v1/messages/count_tokens 与
# /v1/models 需 x-api-key 匹配;/health 与 /reload 不认证。
# 注意:明文 secret_key 不得以 sk-ant- 开头(该前缀保留给 Anthropic 凭证)。
# Claude Code 用 ANTHROPIC_AUTH_TOKEN 或环境变量注入该 key。
secret_key: "sk-ccextra-xxx"

# Antigravity 凭证目录(可选)。默认配置文件旁 .cache/antigravity。
# auth_dir: ".cache/antigravity"

# xAI Grok 凭证目录(可选)。默认配置文件旁 .cache/xai。
# xai_auth_dir: ".cache/xai"

# Codex 凭证目录(可选)。默认配置文件旁 .cache/codex。
# codex_auth_dir: ".cache/codex"

# 凡 config protocol: claude 出站默认走 Bun TLS 指纹车道(wreq/BoringSSL,
# 对齐 Claude Code / Bun peet JA3/JA4 + HTTP/1.1;官方与第三方 Claude 兼容站均适用)。
# 验收: cargo run -p ccextra-server --example peet_fp
# 说明: crates/ccextra-server/src/claude_tls_fp/STATUS.md


# Antigravity 模型白名单(可选)。glob 或精确名;缺省/空 = 全量发布。
# antigravity_models:
#   - "gemini-3.8-flash-*"

# reasoning 级别注册表(可选)。相对配置文件解析,默认同目录 models.json。
# 缺文件 = 不钳制 effort;/reload 会重读。示例见仓库根 models.json。
# models_file: "models.json"

# 官方订阅透传独立实例(127.0.0.1:8223,目录 ../ccextra-official)开关:on/off,缺省 off(也接受 true/false)。
# 仅 service.sh 读取:on 时 start/restart 同时拉起该实例(LaunchAgent com.wanghao.ccextra-official,登录时随开关自启),
# 运行目录缺失时自动由 scripts/official/config.yaml.example 生成(也可 ./service.sh official-init),二进制随仓库根 ./ccextra 同步;
# off 时确保它停止并移除其 plist。不改变本进程任何行为,/reload 不生效;改后执行 ./service.sh restart。
official_instance: off

# Antigravity 连接池(可选)。默认短连接:空闲连接响应结束即关闭,
# 防止凭证轮换下 socket 堆积与陈旧连接错误;仅显式 enabled: true 才保留池。
# antigravity:
#   # 数据面经同目录 ccextra-gohttp(Go net/http,官方 TLS 指纹)转发;默认 false = reqwest。
#   # 打开后 ccextra 自己拉起/收掉 sidecar(socket 在配置文件旁 .cache/),/reload 生效。
#   # 找不到二进制即报错,不回退;走本次请求已解析的代理(http/https/socks5→socks5h,direct/none 直连)。
#   # 仅切 AG 数据面,OAuth 刷新/模型列表仍走 reqwest(按代理配置)。
#   # 打开后下面 connection-pool 不生效:池由 Go 默认 Transport 管(短连接默认、按凭证隔离都不适用)。
#   gohttp: false
#   connection-pool:
#     enabled: false             # 是否启用连接池(默认 false = 短连接)
#     idle-conn-timeout: "30s"   # 空闲连接存活时长(默认 30s,上限 210s)
#     max-idle-conns-per-host: 2 # 每凭证每 host 最大空闲连接数(默认 2,上限 100)

# Provider 定义
# 校验:非 anthropic_official provider 的 key 必填且不能为空白;
# model 的 alias/name 含 * 的通配条目只限 anthropic_official,且须为 claude-* 形式(见下方注释示例)。
providers:
  - name: xxx1
    protocol: claude
    base_url: https://xxx
    key: sk-ant-xxx
    # 可选；覆盖全局代理，"direct"/"none" 直连，空字符串视为配置错误
    proxy_url: "direct"
    models:
      - name: claude-opus-5
        alias: claude-opus-5
        max_input_tokens: 200000
        max_tokens: 64000
      - name: claude-sonnet-5
        alias: claude-sonnet-5
      - name: claude-fable-5
        alias: claude-fable-5

  - name: xxx2
    protocol: openai_chat
    base_url: https://xxx
    key: sk-xxx
    models:
      - name: glm-5.1
        alias: glm-5.1

  - name: xxx-codex
    protocol: openai_responses
    base_url: https://xxx
    key: sk-xxx
    # 注入派生 prompt_cache_key(provider 级开关,默认 false)
    # key = 会话 ID 裸值(对齐 codex 0.147),确定性桶;仅 openai_chat/openai_responses 生效
    # grok chat 不注入(粘性走 x-grok-conv-id);已有非空 key 不剥(转换后写回)。grok responses 开关开仍注入
    # grok 判定看 payload 后出站 model
    prompt_cache_key: true
    models:
      - name: gpt-5.6-terra
        alias: gpt-5.6-terra

  # Cloud Code Assist(OAuth)。无需手配:启动时自动扫描上方 auth_dir,
  # 为每份有效凭证注入一个 antigravity provider(模型列表自动拉取)。
  # 凭证获取: ./ccextra antigravity-login → 写入 .cache/antigravity
  # 也可显式声明(多 base_url 按序回退:网络/读错、429 切下一个):
  # - name: antigravity
  #   protocol: antigravity
  #   base_url:
  #     - "https://daily-cloudcode-pa.googleapis.com"
  #     - "https://cloudcode-pa.googleapis.com"
  #   key: "ya29.xxx"
  #   models:
  #     - name: gemini-3.7-flash-high
  #       alias: gemini-3.7-flash-high

  # xAI Grok (OAuth)。无需手配:启动时自动扫描上方 xai_auth_dir,
  # 为每份有效凭证注入一个 xai provider(OpenAI Responses 协议)。
  # 凭证获取: ./ccextra xai-login → 写入 .cache/xai

  # 官方 Anthropic 订阅透传(anthropic_official)。建议放进独立实例(如 port: 8223)的配置单独使用:
  # 该实例不设 secret_key、不设 payload;Claude Code 只设 ANTHROPIC_BASE_URL=http://127.0.0.1:8223,
  # 不设 ANTHROPIC_AUTH_TOKEN / ANTHROPIC_API_KEY / apiKeyHelper,由订阅登录的 Authorization 原样转发。
  # 请求字节、请求头(除 hop-by-hop/host/content-length/x-api-key/x-ccextra-key/accept-encoding)、
  # 上游状态/头/错误体/SSE 均原样透传;不插 keepalive、不重建错误、不重试、不刷新凭证。
  # 校验:key 必须留空;base_url 只能是单个 https://api.anthropic.com(端口空或 443,无 path/query/fragment/userinfo);
  # 不得设 metadata;每个模型 alias 必须等于 name(不改写 model)。
  # 通配只限 anthropic_official:每个 provider 至多一条,须以 claude- 开头且只有末尾一个 *;
  # 精确条目优先,/v1/models 不列通配条目。
  # - name: anthropic-official
  #   protocol: anthropic_official
  #   base_url: https://api.anthropic.com
  #   proxy_url: "direct"
  #   models:
  #     - name: claude-opus-5-5
  #       alias: claude-opus-5-5
  #     - name: "claude-*"
  #       alias: "claude-*"

# Payload 参数覆盖(按模型名模式匹配;protocol 限定生效目标协议)
# openai_chat 出站会在 payload 后再守卫:kimi 非法 temperature 剥掉;
# tool_stream 仅保留 qwen/glm(百炼文档);gpt-5/o 等把 max_tokens 迁为 max_completion_tokens。
payload:
  - models:
      - "*glm*"
      - "*kimi*"
      - "*qwen*"
    params:
      max_tokens: 32000
      temperature: 0.1

  # tool_stream:百炼可选字段(默认 false,仅 stream=true);文档支持 Qwen/GLM,勿打到 kimi/doubao
  # clear_thinking 仍偏智谱 Chat
  - models:
      - "*glm*"
      - "*GLM*"
      - "*qwen*"
      - "*Qwen*"
    protocol: openai_chat
    params:
      tool_stream: true

  - models:
      - "*glm*"
      - "*GLM*"
    protocol: openai_chat
    params:
      clear_thinking: false

  - models:
      - "*gpt*"
    protocol: openai_chat
    params:
      temperature: 0.1

# 缓存归一化
normalize:
  enabled: true
  drift_detector: true

# 日志
logging:
  level: info
  request_body: false
