# ccextra 配置示例

server:
  host: "127.0.0.1"
  port: 8222
  # 可选；全局代理兜底，"direct" 表示不走代理
  proxy_url: "http://127.0.0.1:7897"

# 入口 secret key(可选)。配置后 /v1/models 与 /v1/messages 需 x-api-key 匹配。
# Claude Code 用 ANTHROPIC_AUTH_TOKEN 或环境变量注入该 key。
secret_key: "sk-ccextra-xxx"

# Antigravity 凭证目录(可选)。默认配置文件旁 .cache/antigravity。
# auth_dir: ".cache/antigravity"

# Provider 定义
providers:
  - name: xxx1
    protocol: claude
    base_url: https://xxx
    key: sk-ant-xxx
    # 可选；覆盖全局代理，"direct" 表示不走代理
    proxy_url: "direct"
    models:
      - name: claude-opus-5
        alias: claude-opus-5
        max_input_tokens: 200000
        max_tokens: 64000
      - name: claude-sonnet-5
        alias: claude-sonnet-5
      - name: claude-fable-5
        alias: claude-fable-5

  - name: xxx2
    protocol: openai_chat
    base_url: https://xxx
    key: sk-xxx
    models:
      - name: glm-5.1
        alias: glm-5.1
        # 可选:覆盖静态注册表的 reasoning_effort 上限
        # 注册表已内置常见模型(glm/gpt/kimi/qwen/doubao/deepseek/claude),按模糊匹配自动降级
        # 仅特情况需手动配置(如注册表遗漏的新模型)

  - name: xxx-codex
    protocol: openai_responses
    base_url: https://xxx
    key: sk-xxx
    # 注入派生 prompt_cache_key(provider 级开关,默认 false)
    # UUIDv5 按 会话+模型+agent 派生,确定性桶;仅 openai_chat/openai_responses 生效
    prompt_cache_key: true
    models:
      - name: gpt-5.6-terra
        alias: gpt-5.6-terra

# Payload 参数覆盖(按模型名模式匹配)
payload:
  - models:
      - "*glm*"
      - "*kimi*"
      - "*qwen*"
    params:
      max_tokens: 32000
      temperature: 0.1

  - models:
      - "*gpt*"
    params:
      temperature: 0.1

# 缓存归一化
normalize:
  enabled: true
  drift_detector: true

# 日志
logging:
  level: info
  request_body: false
